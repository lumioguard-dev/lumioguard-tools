name: Build

# Every pull request, because a contributor cannot see a gate they are not run
# through: without this a PR arrives with no lint, no typecheck and no tests,
# and the first person to find out is whoever merges it.
#
# Pushes to master are covered too, so a direct push cannot skip what a PR
# must pass. `workflow_call` is what Release reuses; `workflow_dispatch` keeps
# the manual run.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
