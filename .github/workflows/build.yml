name: Build

# Every pull request, because a contributor cannot see a gate they are not run
# through: without this a PR arrives with no lint, no typecheck and no tests,
# and the first person to find out is whoever merges it.
#
# Pushes to master are covered too, so a direct push cannot skip what a PR
# must pass. `workflow_call` is what Release reuses; `workflow_dispatch` keeps
# the manual run.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm rules:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
