name = "lumioguard-citecheck-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[vars]
ALLOWED_ORIGINS = "*"

[env.production]
name = "lumioguard-citecheck-api"

# citecheck-api.lumioguard.dev, attached as a custom domain in the dashboard: the
# deploy token has no zone-level permission, so declaring the route here fails
# the deploy at the route step even after the script uploads. ONE label deep, on
# the Free plan's `*.lumioguard.dev` wildcard cert.

[env.production.vars]
# Set by the deploy, never here: this repo is public and both values name
# hosts only this deployment owns. Empty blocks every browser origin, so a
# deploy that forgets them fails closed.
ALLOWED_ORIGINS = ""
